<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Cow Monitoring</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f8;
    }
    .card {
      border-radius: 12px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-success px-3">
  <span class="navbar-brand mb-0 h1">🐄 Smart Cow Monitoring</span>
  <span class="text-white">Realtime Dashboard</span>
</nav>

<div class="container mt-4">

  <!-- INFO CARDS -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h6>Status Sensor</h6>
        <h4 class="text-success">Online</h4>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h6>Perilaku</h6>
        <h4 id="behavior">-</h4>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center p-3">
        <h6>Update Terakhir</h6>
        <h6 id="lastTime">-</h6>
      </div>
    </div>
  </div>

  <!-- TABLE REALTIME -->
  <div class="card p-3">
    <h5>Data Sensor Realtime</h5>

    <div style="max-height:300px; overflow-y:auto;">
      <table class="table table-striped mt-2">
        <thead>
          <tr>
            <th>AX</th>
            <th>AY</th>
            <th>AZ</th>
            <th>GX</th>
            <th>GY</th>
            <th>GZ</th>
            <th>Waktu (WIB)</th>
          </tr>
        </thead>
        <tbody id="sensorTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// 🔹 SATU FUNGSI RESMI UNTUK WAKTU WIB
function formatWaktu(waktu) {
  return new Date(waktu).toLocaleString("id-ID", {
    timeZone: "Asia/Jakarta",
    hour12: false
  });
}

function loadData() {
  fetch("/data")
    .then(res => res.json())
    .then(data => {
      let tbody = document.getElementById("sensorTable");
      tbody.innerHTML = "";

      if (data.length > 0) {
        // ✅ SUDAH LEWAT FORMAT WIB
        document.getElementById("lastTime").innerText =
          formatWaktu(data[0].created_at);
      }

      data.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td>${row.ax}</td>
            <td>${row.ay}</td>
            <td>${row.az}</td>
            <td>${row.gx}</td>
            <td>${row.gy}</td>
            <td>${row.gz}</td>
            <td>${formatWaktu(row.created_at)}</td>
          </tr>
        `;
      });
    });
}

// refresh tiap 1 detik
setInterval(loadData, 1000);
loadData();
</script>

</body>
</html>
